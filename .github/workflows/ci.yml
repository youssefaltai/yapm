name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test (Node + Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Runs the shared hub contract suite on Node (libSQL) and inside workerd (D1).
      - run: pnpm test

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yapm/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/e2e/test-results

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yapm-hub .
      - name: Smoke test the image
        run: |
          docker run -d --name hub -p 8787:8787 yapm-hub
          for i in $(seq 1 30); do curl -sf localhost:8787/api/health && break; sleep 1; done
          curl -sf localhost:8787/api/setup | grep -q '"needsSetup":true'
          curl -sf localhost:8787/ | grep -q '<div id="root">'

  cloudflare-bundle:
    name: Cloudflare Worker bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yapm/web build
      - run: pnpm --filter @yapm/hub-cloudflare exec wrangler deploy --dry-run --outdir dist
