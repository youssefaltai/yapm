name: Deploy to Cloudflare

# Deploys the hub and web app to the Cloudflare account in the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Creates the D1 database on the
# first run and applies migrations every run. Skipped when the secrets are not set.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        name: Create or find the D1 database
        working-directory: apps/hub-cloudflare
        run: node scripts/ensure-d1.mjs
      - if: steps.secrets.outputs.ready == 'true'
        name: Build the web app
        run: pnpm --filter @yapm/web build
      - if: steps.secrets.outputs.ready == 'true'
        name: Apply database migrations
        working-directory: apps/hub-cloudflare
        run: npx wrangler d1 migrations apply yapm --remote
      - if: steps.secrets.outputs.ready == 'true'
        name: Deploy the Worker
        working-directory: apps/hub-cloudflare
        run: npx wrangler deploy --var YAPM_VERSION:${GITHUB_SHA::7}
